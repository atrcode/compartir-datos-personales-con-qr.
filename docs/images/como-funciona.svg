<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="390" viewBox="0 0 1360 390" role="img" aria-labelledby="title desc"><title id="title">De tus datos a un contacto compartido</title><desc id="desc">Cuatro pasos: conversar y recopilar datos, preparar el sitio y la firma, publicar el sitio y generar el QR definitivo.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect x="0" y="0" width="1360" height="390" rx="24" fill="#173F3B"/><text x="40" y="60" fill="#FFF" font-size="32" font-weight="700">Así funciona</text><rect x="40" y="88" width="288" height="236" rx="18" fill="#FFF"/><rect x="60" y="106" width="39" height="39" rx="20" fill="#DCEBE2"/><text x="72" y="133" fill="#163E3B" font-size="20" font-weight="700">1</text><text x="60" y="183" fill="#163E3B" font-size="24" font-weight="700">Conversamos</text><text x="60" y="221" fill="#4E6863" font-size="17" font-weight="400">Nombre, bio y contactos.</text><text x="60" y="248" fill="#4E6863" font-size="17" font-weight="400">Logo, foto y materiales</text><text x="60" y="275" fill="#4E6863" font-size="17" font-weight="400">son opcionales.</text><text x="339" y="218" fill="#ACD9C2" font-size="27" font-weight="700">→</text><rect x="370" y="88" width="288" height="236" rx="18" fill="#FFF"/><rect x="390" y="106" width="39" height="39" rx="20" fill="#DCEBE2"/><text x="402" y="133" fill="#163E3B" font-size="20" font-weight="700">2</text><text x="390" y="183" fill="#163E3B" font-size="24" font-weight="700">Preparamos</text><text x="390" y="221" fill="#4E6863" font-size="17" font-weight="400">Diseño del sitio, vCard,</text><text x="390" y="248" fill="#4E6863" font-size="17" font-weight="400">firma de email e instructivo</text><text x="390" y="275" fill="#4E6863" font-size="17" font-weight="400">para tu aplicación.</text><text x="669" y="218" fill="#ACD9C2" font-size="27" font-weight="700">→</text><rect x="700" y="88" width="288" height="236" rx="18" fill="#FFF"/><rect x="720" y="106" width="39" height="39" rx="20" fill="#DCEBE2"/><text x="732" y="133" fill="#163E3B" font-size="20" font-weight="700">3</text><text x="720" y="183" fill="#163E3B" font-size="24" font-weight="700">Publicamos</text><text x="720" y="221" fill="#4E6863" font-size="17" font-weight="400">Alojamos el sitio en la</text><text x="720" y="248" fill="#4E6863" font-size="17" font-weight="400">plataforma elegida y</text><text x="720" y="275" fill="#4E6863" font-size="17" font-weight="400">comprobamos la URL.</text><text x="999" y="218" fill="#ACD9C2" font-size="27" font-weight="700">→</text><rect x="1030" y="88" width="288" height="236" rx="18" fill="#FFF"/><rect x="1050" y="106" width="39" height="39" rx="20" fill="#DCEBE2"/><text x="1062" y="133" fill="#163E3B" font-size="20" font-weight="700">4</text><text x="1050" y="183" fill="#163E3B" font-size="24" font-weight="700">Compartís</text><text x="1050" y="221" fill="#4E6863" font-size="17" font-weight="400">Generamos y verificamos</text><text x="1050" y="248" fill="#4E6863" font-size="17" font-weight="400">el QR definitivo. Ya podés</text><text x="1050" y="275" fill="#4E6863" font-size="17" font-weight="400">usar tu nuevo kit.</text><text x="40" y="364" fill="#DCEBE2" font-size="18" font-weight="400">Si todavía no hay una URL pública estable, el QR final queda pendiente.</text></svg>