name: Nearby mobile prototype
on:
  push:
    paths:
      - 'prototypes/nearby/**'
      - 'scripts/build_nfc.py'
      - '.github/workflows/nearby.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: python3 prototypes/nearby/tests/check_protocols.py java
      - run: gradle -p prototypes/nearby/android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tarjeta-cerca-android-debug
          path: prototypes/nearby/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 prototypes/nearby/tests/check_protocols.py swift
      - run: brew install xcodegen
      - run: xcodegen generate --spec prototypes/nearby/ios/project.yml
      - run: xcodebuild -project prototypes/nearby/ios/TarjetaCerca.xcodeproj -scheme TarjetaCerca -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
